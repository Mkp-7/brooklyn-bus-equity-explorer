<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="leaflet.css">
<style>
html,body{height:100%;margin:0;background:transparent}
#map{position:relative;width:100%;height:480px;box-sizing:border-box;border:1px solid #c8d4e3;border-radius:10px;overflow:hidden;background:#f5f5f2}
.leaflet-container{background:#f5f5f2;font:12px/1.4 Arial,sans-serif}
.leaflet-tooltip{padding:4px 6px;border:1px solid #c8d4e3;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.2);background:#fff}
.leaflet-popup-content{margin:10px 12px}
.tip{font-family:Arial,sans-serif;min-width:230px;padding:2px}
.tip-title{font-size:14px;font-weight:700;color:#0039A6;border-bottom:2px solid #ffd400;padding-bottom:5px;margin-bottom:4px}
.tip-row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #e5eaf1;padding:4px 0;color:#506176;font-size:12px}
.tip-row b{color:#132238;text-align:right}
.popup-open .leaflet-tooltip{display:none !important}
#legend{position:absolute;left:10px;bottom:22px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid #c8d4e3;border-radius:6px;
  padding:6px 9px;font:11px/1.35 Arial,sans-serif;color:#33475b;box-shadow:0 1px 6px rgba(0,0,0,.15);pointer-events:none}
#legend .lg-t{font-weight:700;color:#0039A6;margin-bottom:3px}
#legend .lg-bar{width:124px;height:9px;border-radius:2px}
#legend .lg-sc{display:flex;justify-content:space-between;width:124px;margin-bottom:4px}
#legend .lg-r{display:flex;align-items:center;gap:6px;margin-top:2px}
#legend .lg-line{display:inline-block;width:16px;height:3px;background:#ee7020;border-radius:2px}
#legend .lg-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#0f5257;border:1.5px solid #fff;box-shadow:0 0 0 1px #0f5257}
#legend .lg-gray{display:inline-block;width:12px;height:9px;background:#cdcdcd}
#note{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:#fff7e0;border:1px solid #f0d98a;color:#6b5200;
  border-radius:6px;padding:4px 12px;font:12px/1.3 Arial,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.15);max-width:70%;text-align:center;display:none}
</style>
</head>
<body>
<div id="map"><div id="legend"></div><div id="note"></div></div>
<script src="leaflet.js"></script>
<script src="map.js"></script>
</body>
</html>
